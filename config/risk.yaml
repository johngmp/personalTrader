# Hard risk limits. Enforced in code on every order, even in auto mode.
# Only YOU change this file. Scheduled AI tasks are never allowed to edit it.

mode: paper                   # paper | live  (live refuses to start in this plan)
autonomy: auto                # auto-execute approved orders on paper

account:
  max_gross_exposure_pct: 100 # total position value <= 100% of equity (no leverage)
  max_daily_loss_pct: 3       # block new entries for the rest of the day
  max_drawdown_halt_pct: 15   # engage the kill switch; needs `trader resume`
  max_correlated_exposure_pct: 40
  # Raised 60 -> 150 on 2026-10-08, at your request, to let S8 run on 40 markets.
  # A cold start needs an entry AND a protective stop for each market it enters: measured with the cap
  # lifted, exactly 80 orders. At 60 the entries filled and then the STOPS were refused, which leaves
  # open positions unprotected for the rest of the day -- the one failure this system exists to prevent.
  # 150 covers a full cold start plus stop maintenance with headroom, and still catches a runaway loop,
  # which would be thousands rather than dozens.
  max_orders_per_day: 150

sleeve_defaults:
  max_position_pct_of_sleeve: 25
  risk_per_trade_pct: 1       # (entry - stop) x qty <= 1% of the sleeve's capital
  max_leverage: 1.0
  require_stop: true          # every entry must carry a stop price
  max_drawdown_disable_pct: 25

ai_signals:                   # used from Phase 4
  inbox: signals/inbox
  schema_version: 1
  max_age_minutes: 90
  allowed_symbols_only: true
  ai_sleeve_capital_pct: 5

guards:
  kill_switch_file: KILL_SWITCH
  refuse_if_paper_flag_but_live_endpoint: true
  stale_data_seconds: 300     # never trade on a price older than this
  duplicate_order_window_s: 60
