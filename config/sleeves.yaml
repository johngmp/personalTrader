# Each sleeve is one strategy with its own virtual slice of the paper account.
# Strategies are switched on in later phases, after they pass Gate 1 (see PLAN.md §6).

sleeves:
  - id: TEST
    name: Pipeline smoke tests (`trader order --test`)
    enabled: true
    broker: alpaca
    capital_usd: 1000
    symbols: [BTC/USD, ETH/USD, SPY]

  - id: B0
    name: Buy-and-hold benchmark
    enabled: true            # approved 2026-09-18 for Phase 3 paper trading
    broker: alpaca
    capital_usd: 10000
    symbols: [SPY, QQQ, BTC/USD]
    # Holds a third in each and never sells, so no stops.
    limits:
      max_position_pct_of_sleeve: 34
      risk_per_trade_pct: 1
      max_leverage: 1.0
      require_stop: false
      max_drawdown_disable_pct: 100

  - id: S1
    name: Trend following
    enabled: true            # approved 2026-09-18 after passing Gate 1
    broker: alpaca
    capital_usd: 10000
    symbols: [BTC/USD, ETH/USD, QQQ, SPY]
    benchmark: B0
    params: {fast: 20, slow: 200, atr_mult: 2.5}   # chosen by Gate 1 on 1995-2017 data

  - id: S2
    name: Cross-asset momentum rotation
    enabled: false
    broker: alpaca
    capital_usd: 10000
    symbols: [SPY, EFA, TLT, GLD, BIL]
    benchmark: SPY
    # Rotation holds 1-2 whole ETFs (or cash via BIL) and exits by monthly re-ranking, not stops,
    # so it needs its own limits. Everything else stays at the defaults.
    limits:
      max_position_pct_of_sleeve: 100
      risk_per_trade_pct: 1
      max_leverage: 1.0
      require_stop: false
      max_drawdown_disable_pct: 25

  - id: S3
    name: Short-term mean reversion
    enabled: false
    broker: alpaca
    capital_usd: 10000
    symbols: [SPY, QQQ]
    benchmark: SPY

  - id: S4
    name: FX trend following (Fusion Markets demo, via cTrader)
    enabled: false
    broker: ctrader        # was oanda, until OANDA's live-account KYC blocked signup (2026-09-20)
    capital_usd: 10000
    symbols: [EUR/USD, AUD/USD, GBP/USD, XAU/USD]   # USD-quoted only; USD/JPY dropped (its P&L is in yen)
    params: {fast: 50, slow: 150, atr_mult: 3.5}    # chosen by Gate 1 (re-run 2026-09-18 on these 4 symbols)
    # Gate 1 must be re-run before this is enabled: the params above were fitted with OANDA's spreads,
    # and Fusion's are different. Costs live in config/costs.yaml under `forex`, not per broker.

  # --- Phase 4: AI strategies (built 2026-09-19; switched on after the Phase 3 check) ---------------
  - id: S5
    name: Trend following + AI analyst veto
    enabled: false
    broker: alpaca
    capital_usd: 5000            # AI sleeves get smaller slices (risk.yaml ai_sleeve_capital_pct)
    symbols: [BTC/USD, ETH/USD, QQQ, SPY]
    benchmark: S1                # A/B test: same rules as S1, plus the AI's approve/veto on entries
    strategy: S1
    params: {fast: 20, slow: 200, atr_mult: 2.5}
    ai: analyst-team

  - id: S6
    name: AI investor panel
    enabled: false
    broker: alpaca
    capital_usd: 5000
    symbols: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, JPM, BRK.B, JNJ, XOM]
    benchmark: SPY
    strategy: S6
    params: {stop_atr: 3.0}
    ai: investor-panel
    limits:
      max_position_pct_of_sleeve: 15
      risk_per_trade_pct: 1
      max_leverage: 1.0
      require_stop: true
      max_drawdown_disable_pct: 25

  # --- Shadow tests: live prices, NO orders sent (research before a paper slice) --------------------
  - id: S8
    name: Trend following, diversified (40 markets)
    enabled: true            # unblocked 2026-10-08: risk.yaml max_orders_per_day raised 60 -> 150
    # Promoted shadow -> paper on 2026-10-03, after Gate 1 PASSED on the widened 40-market basket
    # (out-of-sample Sharpe 0.85 vs buy-and-hold 0.62; deflated Sharpe 99.3% after 90 distinct trials).
    # Still PRETEND money: risk.yaml mode=paper and the Alpaca key is a paper key.
    broker: alpaca
    # Raised 10,000 -> 15,000 on 2026-10-08, because at 10,000 this sleeve could not buy its own
    # basket. Equity is split across every market that is trending at once: with 21 wanting entry that
    # is $544 each, and US equities round DOWN to whole shares, so SPY ($777), QQQ ($758) and MDY
    # ($664) each floored to zero shares and were silently never ordered. Not marginal names -- the
    # core equity exposure, and the Gate 1 backtest HELD them because it sized fractionally. Whole
    # shares are the right choice (Alpaca will not hold a stop against a fractional position, so
    # fractional means positions the broker cannot protect), so the capital has to clear the share
    # price instead. See the note below for what this does and does not fix.
    # 15,000 -> 33,000 on 2026-10-08. 15,000 cleared one share of everything on a day when 21 markets
    # were trending, but the allocation scales as 1/n: SPY dropped out again at 23 simultaneous entries,
    # and a broad rally is exactly when a trend strategy most wants to own it. 33,000 keeps the whole
    # 40-market basket affordable even when all 40 trend at once.
    #
    # The trade-off, stated plainly: risk_per_trade_pct is 1% of sleeve capital, so the risk on any one
    # trade goes from $150 to $330. The account-level guards are what bound the damage -- 3% daily loss
    # and a 15% drawdown halt -- not the sleeve size.
    capital_usd: 33000
    # Widened 19 -> 40 on 2026-10-03, to answer a question about TIME rather than about returns.
    # Measured over its first 14 days, S8 completed 7 round trips across 19 markets -- about 15 closed
    # trades a month, so the 50 trades Gate 2 wants would take ~3.3 months. S1, on 4 markets, completed
    # ZERO in 15 days: it bought at inception and held. Trade count scales with breadth, so roughly
    # doubling the markets roughly halves the wait, at the same 1% risk per trade.
    #
    # This is the honest way to go faster. The alternative -- lowering the bar, or trading more often
    # per market -- buys speed with evidence, and intraday research already showed where that ends:
    # 5 trades a day costs 4.6%/yr in spread against S1 earning 4.4%/yr in total.
    symbols: [SPY, QQQ, IWM, MDY, EFA, EEM, EWJ, EWZ, FXI, EWU, EWA,
              XLF, XLK, XLI, XLP, XLY, XLB, XLE, XLU, XLV,
              TLT, IEF, SHY, TIP, LQD, HYG,
              GLD, SLV, GDX, DBC, USO, UNG, DBA, VNQ,
              UUP, FXE, FXY,
              BTC/USD, ETH/USD, SOL/USD]
    benchmark: B0
    strategy: S8
    params: {fast: 20, slow: 200, atr_mult: 2.5}   # chosen by Gate 1 (2026-09-19): PASS, out-of-sample Sharpe 0.98
    # Gate 1 re-ran on the 40-market basket on 2026-10-03 and PASSED all eight checks: out-of-sample
    # Sharpe 0.85 vs buy-and-hold 0.62, worst drop -19.0%, 4261 completed trades, neighbouring settings
    # keep 95% of the Sharpe, deflated Sharpe 99.3% confident after 90 distinct trials, profitable
    # out-of-sample on 29 of the 40 symbols.
    #
    # WHAT WAS BLOCKING IT, and why the budget matters. A cold start on 40 markets wants 80 orders: an
    # entry and a protective stop for each. risk.yaml used to cap the whole ACCOUNT at 60, shared with
    # B0 and S1, and shadow orders count too (they get a broker_order_id). Measured, not guessed: with
    # the cap lifted a cold start placed exactly 80; at 60 the entries filled and then the STOPS were
    # refused -- "could not place S8 stop for QQQ: max_orders_per_day" -- leaving positions open and
    # unprotected for the rest of the day. The cap was raised to 150 on 2026-10-08, which covers a cold
    # start plus stop maintenance. test_s8_at_the_shipped_order_budget_starves_its_stops pins the
    # failure mode so a future reduction cannot quietly bring it back.

  - id: S8S
    name: Trend following, diversified (19 markets, shadow archive)
    enabled: false           # finished 2026-10-03; kept so its record stays readable, never traded again
    broker: shadow
    capital_usd: 10000
    symbols: [SPY, QQQ, IWM, EFA, EEM, TLT, IEF, GLD, SLV, DBC, USO, VNQ, XLE, XLU, XLV, UUP, BTC/USD, ETH/USD, SOL/USD]
    benchmark: B0
    strategy: S8
    params: {fast: 20, slow: 200, atr_mult: 2.5}
    # This is S8's original shadow run, 2026-09-19 to 2026-10-03: 19 markets, live prices, no orders
    # ever sent. When S8 was widened to 40 markets and promoted to the paper broker, its journal rows
    # were renamed S8 -> S8S rather than carried over, for two reasons. The 10 positions it held were
    # never actually bought, so reconciliation against the real paper account would have flagged every
    # one of them and refused to trade those symbols. And a sleeve whose history is half shadow and
    # half paper reports a return that means nothing. No fills were invented and none were deleted.

  - id: S9
    name: FX trend (shadow, Yahoo prices, no broker)
    enabled: true            # shadow only: prices come from Yahoo, nothing is ever sent to a broker
    broker: shadow_fx
    capital_usd: 10000
    symbols: [EUR/USD, AUD/USD, GBP/USD, XAU/USD]
    benchmark: B0
    strategy: S4             # the same FX trend rules S4 would have traded on cTrader
    params: {fast: 50, slow: 150, atr_mult: 3.5}
    # Runs with no credentials at all, so forex is measurable whether or not cTrader is ever approved.
    # Expect it to do poorly: measured 2026-09-20, these rules return 2.09%/yr at Sharpe 0.49 BEFORE
    # any swap cost, and break even once swap reaches ~2 bps/day. This sleeve exists to find out in
    # public rather than in a backtest -- every signal is journalled and scored against B0.
