# Cost haircut applied to every fill in the journal. Paper fills ignore spread,
# slippage and fees, so strategies are judged on P&L after these costs.
# Values are basis points (1 bp = 0.01%) per side.
# fee_bps is an estimate added on top; broker_fee_bps is what the broker actually deducts,
# so it is recorded as a real cost and kept out of the estimate to avoid counting it twice.

us_equity:
  half_spread_bps: 1.0
  slippage_bps: 3.0
  fee_bps: 0.5      # regulatory fees on sells, rounded up and applied to both sides

crypto:
  half_spread_bps: 5.0
  slippage_bps: 10.0
  fee_bps: 0.0
  broker_fee_bps: 25.0  # Alpaca really charges this, on paper too: in coins on buys, in USD on sells

forex:
  half_spread_bps: 1.0
  slippage_bps: 1.0
  fee_bps: 0.0
  # Overnight financing (swap), charged every day a position stays open. PLACEHOLDER: ~2.5%/yr, pending
  # the real per-symbol Swap Long figures from Fusion. This matters far more than the numbers above --
  # S4 holds for weeks, so swap is roughly 40x its trading cost. Measured 2026-09-20 on 2000-2026 data,
  # S4's CAGR falls 2.09% -> 1.11% -> 0.13% at 0 / 1.0 / 2.0 bps per day: it breaks even near 2.0.
  carry_bps_per_day: 1.0
