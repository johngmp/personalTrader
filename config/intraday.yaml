# Intraday session-reversion signals, sent to Telegram for you to execute by hand.
# This NEVER places an order. It is a watcher: it works out the day's levels, then tells you when the
# rate reaches them.
#
# EUR/USD and GBP/USD. AUD/USD is deliberately absent, and the difference between them is the finding
# rather than a default nobody got round to changing. Tested on 272 / 268 / 244 days of real tick data
# with the spread actually quoted, using the setting chosen on EUR/USD's first 60% and applied unchanged
# to pairs it had never seen:
#
#     EUR/USD   +17.2%/yr    gross +$792   spread  $113
#     GBP/USD    +3.0%/yr    gross +$593   spread  $265
#     AUD/USD    -1.3%/yr    gross +$406   spread  $541
#
# The gross edge is similar on all three; what differs is the cost. London-session median spreads are
# 0.29 / 0.62 / 0.88 pips, so the same edge clears the bar only where the bar is lowest. And no filter
# fixes the others: 0.0% of AUD/USD's London bars are at or under 0.5 pips, so waiting for a tight
# spread there means never trading at all.
#
# GBP/USD was added on 2026-10-08 at the user's request and REMOVED the same evening, because the
# number it was added on turned out to be measured wrong. The backtest harness ignored the 16:00 close
# that the live watcher enforces and scanned to the end of the UTC day instead, so 44% of trades exited
# up to eight hours later than the live rule allows. With the close enforced:
#
#     EUR/USD   in-sample pick is the setting shipped here; out-of-sample +4.0%/yr over 34 trades,
#               24/30 of the grid positive out of sample and 20/30 positive in BOTH halves
#     GBP/USD   its own in-sample pick scores -2.0%/yr out of sample, and only 10/30 of the grid is
#               positive in both halves. The +10%/yr this setting shows on GBP is a setting chosen on
#               EUR/USD that LOSES in-sample on GBP, which is not evidence of anything
#
# So one pair, on a much thinner edge than was first claimed: +4.0%/yr, not the +17.2% that the broken
# deadline produced. It is NOT advice.
enabled: true
symbols:
  - EUR/USD

# Chosen on EUR/USD's first 60% of history, then measured once on the rest. Do not tune these against
# recent results: that is exactly how the opening-range breakout produced +$506 in-sample and -36%/yr
# out of it.
drop_atr: 0.5          # how far below the session open a fall must go before it is worth buying
stop_atr: 0.3          # how much further it may go before the idea is wrong
target_frac: 1.0       # 1.0 = aim all the way back to the session open
atr_days: 20           # days of daily range used to size "how far is far"

open_utc: "07:00"      # London open
close_utc: "16:00"     # flat before the thin late session

# Used only to state a position size in the message. No money is allocated and no order is sent.
#
# 175 is the real balance of the Fusion account these messages are typed into, set 2026-11-14. It was
# 10000 before, which was a placeholder nobody had a reason to change while this was paper -- and a
# message sized for $10,000 says 0.41 lots, which on $175 is 27x the account in EUR/USD and would be
# refused or ruin it.
#
# At this balance the sizing arithmetic no longer binds: 1% of $175 over a median 24 pip stop is 723
# units, and the smallest trade a broker accepts is 1,000. So every plan is 0.01 lots and the risk is
# whatever that costs -- $1.20 on a quiet day, $5.40 on a wide one, 0.7% to 3.1% of the account. The
# plan message says so when it happens rather than quoting a 1% it is not delivering.
capital_usd: 175
risk_pct: 1.0

# The smallest volume the broker will accept, in lots. CONFIRMED 2026-11-17 by you, after being carried
# as "0.01 I think" since 2026-11-14 -- the screenshot we had showed 0.02 in the volume box, which is a
# ticket someone filled in, not the floor.
#
# It matters more than any other number in this file, because at $175 it is what sets the position size
# on every trade rather than the risk rule: 1% of $175 over a median 24 pip stop is 723 units and the
# floor is 1,000. So every plan is 0.01 lots and the risk is whatever that costs -- $1.20 on a quiet
# day, $5.40 on a wide one, 0.7% to 3.1% of the account, about 1.4% typically. Now that it is
# confirmed, that range is the real risk being run and not a guess. Had it been 0.02 it would have been
# 2.8% typical and 6.2% on a wide day, which is why this was worth asking about rather than assuming.
min_lot: 0.01
