[project]
name = "personal-trader"
version = "0.1.0"
description = "Personal multi-market AI trading agent (paper trading first)"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.40",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rumps>=0.4.0",
    "yfinance>=1.7.0",
]

[project.scripts]
trader = "trader.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
